[project]
name = "alune-platform-api"
version = "0.1.0"
description = "FastAPI backend for alune-platform."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
  "alembic>=1.17.0",
  "asyncpg>=0.31.0",
  "fastapi[standard]>=0.138.0,<0.138.1",
  "minio>=7.2.20",
  "passlib[argon2]>=1.7.4",
  "pydantic>=2.12.0",
  "pydantic-settings>=2.14.2",
  "python-jose[cryptography]>=3.5.0",
  "python-multipart>=0.0.32",
  "redis>=8.0.0",
  "sqlalchemy[asyncio]>=2.0.51"
]

[dependency-groups]
dev = [
  "httpx>=0.28.0",
  "pytest>=9.1.1",
  "pytest-asyncio>=1.4.0",
  "ruff>=0.15.18",
  "ty>=0.0.51"
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "ASYNC", "RUF"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["app/tests"]
filterwarnings = [
  "ignore:Accessing argon2.__version__ is deprecated.*:DeprecationWarning:passlib.handlers.argon2"
]

[tool.ty]

[tool.ty.environment]
python-version = "3.14"
