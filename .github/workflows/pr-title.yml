name: PR title

# pull_request_target reads the title with the default-branch workflow.
# Do not checkout the pull request head here.
# A pull request opened with GITHUB_TOKEN does not emit pull_request_target.
# release-please.yml uses RELEASE_PLEASE_TOKEN when that secret exists so
# this check still runs on release pull requests.

on:
  pull_request_target:
    types:
      - opened
      - edited
      - reopened
      - synchronize

permissions:
  contents: read

jobs:
  validate:
    # Required status check name. Rename together with branch protection.
    name: Validate PR title
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read

    steps:
      - name: Check Conventional Commits
        uses: amannn/action-semantic-pull-request@2252a14e810aa9b85c2d560bd7070c802206ecf6 # v6.1.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
